[tool.poetry]
name = "vulnerable-fastapi"
version = "0.1.0"
description = "Demo FastAPI app with an intentional vulnerable sqlparse pin for Lightwell Part 2"
authors = ["Lightwell SSA Demo <demo@dasmlab.local>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
# Ranges intentionally cover both public PyPI and Lightwell Python Validated catalogs.
fastapi = ">=0.114.0,<0.163"
uvicorn = { extras = ["standard"], version = ">=0.32.0,<0.55" }
httpx = ">=0.27.0,<0.29"
# Intentional vulnerable pin for scanner before/after.
# Public/Validated sqlparse 0.5.5 trips Trivy HIGH CVEs; Remediated serves 0.5.5+rhlw.1.
sqlparse = "0.5.5"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"

# Default: PyPI. Live demo adds Lightwell via scripts/configure-poetry-source.sh

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
