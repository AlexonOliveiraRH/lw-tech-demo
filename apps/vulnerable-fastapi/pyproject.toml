[tool.poetry]
name = "vulnerable-fastapi"
version = "0.1.0"
description = "Demo FastAPI app pinned to Lightwell's three Python Remediated packages (vulnerable public versions)"
authors = ["Lightwell SSA Demo <demo@dasmlab.local>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
# Ranges cover public PyPI and Lightwell Python Validated.
fastapi = ">=0.114.0,<0.163"
uvicorn = { extras = ["standard"], version = ">=0.32.0,<0.55" }
httpx = ">=0.27.0,<0.29"
# --- Lightwell Python Remediated set (intentional vulnerable public pins) ---
# After remediate, these resolve to +rhlw.1 from packages.redhat.com remediated.
sqlparse = "0.5.5"
PyPDF2 = "3.0.1"
tokenizers = "0.23.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"
# pip-audit is installed from public PyPI in scan scripts (not always on Validated).

# Default: public PyPI. Remediate workflow adds Lightwell Validated + Remediated sources.

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
