# Place as ~/.pip/pip.conf or /etc/pip.conf, or export PIP_INDEX_URL.
# Point index-url at the Artifactory virtual that fronts Lightwell.

[global]
index-url = http://localhost:8082/artifactory/api/pypi/pypi-virtual/simple
# trusted-host = localhost
# extra-index-url = https://pypi.org/simple

# Auth (Artifactory): use netrc or
# index-url = https://user:token@artifactory.example/artifactory/api/pypi/pypi-virtual/simple
