# Local Artifactory OSS sandbox for Part 2 segment 2 rehearsal.
# Default UI: http://localhost:8082  (admin / password — change on first login)
#
# Note: OSS features vary by version. Remote PyPI + virtual repos are the demo path.
# Xray is intentionally out of scope for v1.

services:
  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:7.104.7
    container_name: lw-demo-artifactory
    ports:
      - "8082:8082"
      - "8081:8081"
    volumes:
      - ./data:/var/opt/jfrog/artifactory
    environment:
      # First-boot friendly; change immediately in UI for anything beyond laptop demo
      EXTRA_JAVA_OPTIONS: "-Xms512m -Xmx2g"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/artifactory/api/system/ping"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
