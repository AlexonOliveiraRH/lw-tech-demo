# Step 2 — paste Lightwell user + token for THIS RUN only (not stored in the repo).
# Default runner: GitHub-hosted (ubuntu-latest) so forks / any entitled user can run.

name: "2 · Remediate (Lightwell)"
run-name: "2 · Remediate — @${{ github.actor }} · ${{ inputs.lightwell_user }}"

on:
  workflow_dispatch:
    inputs:
      lightwell_user:
        description: "REQUIRED — Lightwell username (orgId|service-account-name), e.g. 11009103|dasmlwsvc"
        type: string
        required: true
      lightwell_token:
        description: "REQUIRED — Lightwell service-account token for this run only"
        type: string
        required: true
      runner:
        description: "Runner (default GitHub-hosted for self-service; self-hosted optional for maintainers)"
        type: choice
        required: true
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - self-hosted

permissions:
  contents: read

# Intentionally do NOT read repo secrets for user/token — paste per run (fork-friendly).
env:
  LIGHTWELL_PYPI_USER: ${{ inputs.lightwell_user }}
  LIGHTWELL_PYPI_TOKEN: ${{ inputs.lightwell_token }}
  USE_LIGHTWELL: "true"

jobs:
  remediate:
    name: Remediate via Lightwell Network
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Defer Job Summary body
        run: |
          mkdir -p artifacts/live
          : > artifacts/live/_summary_body.md
          echo "LW_REAL_STEP_SUMMARY=${GITHUB_STEP_SUMMARY}" >> "$GITHUB_ENV"
          echo "GITHUB_STEP_SUMMARY=${GITHUB_WORKSPACE}/artifacts/live/_summary_body.md" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mask token
        run: echo "::add-mask::${LIGHTWELL_PYPI_TOKEN}"

      - name: Who ran this
        run: |
          {
            echo "## Run identity"
            echo ""
            echo "| | |"
            echo "|--|--|"
            echo "| GitHub actor | \`@${{ github.actor }}\` |"
            echo "| Lightwell user | \`${{ inputs.lightwell_user }}\` |"
            echo "| Runner | \`${{ inputs.runner }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install tools
        run: WITH_TRIVY=true ./scripts/ci-install-tools.sh

      - name: Configure Lightwell Validated + Remediated
        run: |
          unset PYPI_INDEX_URL || true
          ./scripts/configure-poetry-source.sh

      - name: Resolve + install from Lightwell
        working-directory: apps/vulnerable-fastapi
        run: |
          poetry lock --no-interaction
          poetry install --no-interaction

      - name: Show remediated versions (+rhlw.1)
        working-directory: apps/vulnerable-fastapi
        run: |
          echo "## Installed from Lightwell" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | Version |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|---------|" >> "$GITHUB_STEP_SUMMARY"
          for pkg in sqlparse PyPDF2 tokenizers; do
            ver=$(poetry run python -c "import importlib.metadata as m; print(m.version('$pkg'))")
            echo "| $pkg | \`$ver\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "$pkg=$ver"
            case "$ver" in
              *+rhlw.*) ;;
              *) echo "::error::$pkg is not a Lightwell +rhlw build ($ver)"; exit 1 ;;
            esac
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Remediated** feed → sqlparse / PyPDF2 / tokenizers (\`+rhlw.1\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "**Validated** feed → remaining catalog (FastAPI, httpx, …)." >> "$GITHUB_STEP_SUMMARY"

      - name: Pytest (no app rewrite)
        working-directory: apps/vulnerable-fastapi
        run: poetry run pytest -q

      - name: Scan after + Lightwell proof
        run: ./scripts/scan-after.sh

      - name: SBOM (Lightwell) for Lightwell Lens
        env:
          SBOM_STAGE: after
          SBOM_SKIP_INSTALL: "1"
        run: ./scripts/sbom-generate.sh

      - name: Visual demo report
        working-directory: apps/vulnerable-fastapi
        run: poetry run python ../../scripts/render-demo-report.py after

      - name: Stage flat artifact bundle
        run: ./scripts/stage-artifact-bundle.sh after

      - uses: actions/upload-artifact@v4
        id: upload-remediate-proof
        with:
          # Flat zip root: demo-report-after.html + sbom-after.cdx.json
          name: remediate-proof
          path: artifacts/bundle-after/
          if-no-files-found: warn

      - name: Job Summary (download first)
        env:
          ARTIFACT_URL: ${{ steps.upload-remediate-proof.outputs.artifact-url }}
        run: |
          {
            echo "## Download remediate report and SBOM"
            echo ""
            if [[ -n "${ARTIFACT_URL}" ]]; then
              echo "[**Download zip**](${ARTIFACT_URL}) — \`demo-report-after.html\` + \`sbom-after.cdx.json\` at the zip root."
            else
              echo "Artifact zip: see **Artifacts** at the bottom of this run (\`remediate-proof\`)."
            fi
            echo ""
            echo "Unzip → open the HTML → upload the SBOM to [Lens](https://console.redhat.com/lightwell/lens)."
            echo ""
            echo "---"
            echo ""
            cat artifacts/live/_summary_body.md 2>/dev/null || true
          } >> "${LW_REAL_STEP_SUMMARY}"
