# Self-service demo: Python (FastAPI/Poetry) + Trivy
# One Actions entry — pick step: Scan (before) or Remediate (after).
# Default runner: ubuntu-latest so forks / any entitled user can run.

name: "Demo · Python · Trivy"
run-name: "Demo · Python · Trivy · ${{ inputs.step }} — @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      step:
        description: "1 = Scan (vulnerable / before) · 2 = Remediate (Lightwell / after)"
        type: choice
        required: true
        default: scan
        options:
          - scan
          - remediate
      lightwell_user:
        description: "Remediate only — Lightwell username (orgId|service-account-name), e.g. 11009103|dasmlwsvc"
        type: string
        required: false
        default: ""
      lightwell_token:
        description: "Remediate only — Lightwell service-account token for this run only"
        type: string
        required: false
        default: ""
      runner:
        description: "Runner (default GitHub-hosted for self-service; self-hosted optional for maintainers)"
        type: choice
        required: true
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - self-hosted

permissions:
  contents: read

jobs:
  scan:
    name: Scan vulnerable pins
    if: inputs.step == 'scan'
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: WITH_TRIVY=true ./scripts/ci-install-tools.sh
      - name: Scan before
        env:
          USE_LIGHTWELL: "false"
        run: ./scripts/scan-before.sh
      - name: SBOM (vulnerable) for Lightwell Lens
        env:
          USE_LIGHTWELL: "false"
          SBOM_STAGE: before
          SBOM_SKIP_INSTALL: "1"
        run: ./scripts/sbom-generate.sh
      - name: Visual demo report
        working-directory: apps/vulnerable-fastapi
        run: poetry run python ../../scripts/render-demo-report.py before
      - name: Stage flat artifact bundle
        run: ./scripts/stage-artifact-bundle.sh before
      - uses: actions/upload-artifact@v4
        id: upload-scan-before
        with:
          name: scan-before
          path: artifacts/bundle-before/
          if-no-files-found: warn
      - name: Job Summary
        env:
          ARTIFACT_ID: ${{ steps.upload-scan-before.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload-scan-before.outputs.artifact-url }}
        run: |
          set -euo pipefail
          if [[ -z "${ARTIFACT_URL:-}" && -n "${ARTIFACT_ID:-}" ]]; then
            ARTIFACT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${ARTIFACT_ID}"
          fi
          {
            echo "## Download scan report and SBOM"
            echo ""
            if [[ -n "${ARTIFACT_URL:-}" ]]; then
              echo "[**Download zip**](${ARTIFACT_URL})"
              echo ""
              echo "Zip root: \`demo-report-before.html\` + \`sbom-before.cdx.json\`"
            else
              echo "Open **Artifacts** → \`scan-before\` on this run."
            fi
            echo ""
            echo "Unzip → open the HTML → upload the SBOM to [Lens](https://console.redhat.com/lightwell/lens)."
            echo ""
            echo "---"
            echo ""
            [[ -f artifacts/live/scan-before-summary.md ]] && cat artifacts/live/scan-before-summary.md && echo ""
            [[ -f artifacts/live/demo-report-before.md ]] && cat artifacts/live/demo-report-before.md && echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Summary OK artifact_url=${ARTIFACT_URL:-none} id=${ARTIFACT_ID:-none}"

  remediate:
    name: Remediate via Lightwell Network
    if: inputs.step == 'remediate'
    runs-on: ${{ inputs.runner }}
    env:
      LIGHTWELL_PYPI_USER: ${{ inputs.lightwell_user }}
      LIGHTWELL_PYPI_TOKEN: ${{ inputs.lightwell_token }}
      USE_LIGHTWELL: "true"
    steps:
      - name: Require Lightwell credentials
        run: |
          set -euo pipefail
          if [[ -z "${{ inputs.lightwell_user }}" || -z "${{ inputs.lightwell_token }}" ]]; then
            echo "::error::Remediate requires lightwell_user and lightwell_token (paste from Lightwell Console)."
            exit 1
          fi
          echo "::add-mask::${{ inputs.lightwell_user }}"
          echo "::add-mask::${{ inputs.lightwell_token }}"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: WITH_TRIVY=true ./scripts/ci-install-tools.sh

      - name: Configure Lightwell Validated + Remediated
        run: |
          unset PYPI_INDEX_URL || true
          ./scripts/configure-poetry-source.sh

      - name: Resolve + install from Lightwell
        working-directory: apps/vulnerable-fastapi
        run: |
          poetry lock --no-interaction
          poetry install --no-interaction

      - name: Show remediated versions (+rhlw.1)
        working-directory: apps/vulnerable-fastapi
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/live"
          BODY="${GITHUB_WORKSPACE}/artifacts/live/_summary_body.md"
          {
            echo "## Run identity"
            echo ""
            echo "| | |"
            echo "|--|--|"
            echo "| GitHub actor | \`@${{ github.actor }}\` |"
            echo "| Runner | \`${{ inputs.runner }}\` |"
            echo ""
            echo "## Installed from Lightwell"
            echo ""
            echo "| Package | Version |"
            echo "|---------|---------|"
          } > "$BODY"
          for pkg in sqlparse PyPDF2 tokenizers; do
            ver=$(poetry run python -c "import importlib.metadata as m; print(m.version('$pkg'))")
            echo "| $pkg | \`$ver\` |" >> "$BODY"
            echo "$pkg=$ver"
            case "$ver" in
              *+rhlw.*) ;;
              *) echo "::error::$pkg is not a Lightwell +rhlw build ($ver)"; exit 1 ;;
            esac
          done
          {
            echo ""
            echo "**Remediated** feed → sqlparse / PyPDF2 / tokenizers (\`+rhlw.1\`)."
            echo "**Validated** feed → remaining catalog (FastAPI, httpx, …)."
            echo ""
          } >> "$BODY"

      - name: Pytest (no app rewrite)
        working-directory: apps/vulnerable-fastapi
        run: poetry run pytest -q

      - name: Scan after + Lightwell proof
        run: ./scripts/scan-after.sh

      - name: SBOM (Lightwell) for Lightwell Lens
        env:
          SBOM_STAGE: after
          SBOM_SKIP_INSTALL: "1"
        run: ./scripts/sbom-generate.sh

      - name: Visual demo report
        working-directory: apps/vulnerable-fastapi
        run: poetry run python ../../scripts/render-demo-report.py after

      - name: Stage flat artifact bundle
        run: ./scripts/stage-artifact-bundle.sh after

      - uses: actions/upload-artifact@v4
        id: upload-remediate-proof
        with:
          name: remediate-proof
          path: artifacts/bundle-after/
          if-no-files-found: warn

      - name: Job Summary
        env:
          ARTIFACT_ID: ${{ steps.upload-remediate-proof.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload-remediate-proof.outputs.artifact-url }}
        run: |
          set -euo pipefail
          if [[ -z "${ARTIFACT_URL:-}" && -n "${ARTIFACT_ID:-}" ]]; then
            ARTIFACT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${ARTIFACT_ID}"
          fi
          {
            echo "## Download remediate report and SBOM"
            echo ""
            if [[ -n "${ARTIFACT_URL:-}" ]]; then
              echo "[**Download zip**](${ARTIFACT_URL})"
              echo ""
              echo "Zip root: \`demo-report-after.html\` + \`sbom-after.cdx.json\`"
            else
              echo "Open **Artifacts** → \`remediate-proof\` on this run."
            fi
            echo ""
            echo "Unzip → open the HTML → upload the SBOM to [Lens](https://console.redhat.com/lightwell/lens)."
            echo ""
            echo "---"
            echo ""
            [[ -f artifacts/live/_summary_body.md ]] && cat artifacts/live/_summary_body.md && echo ""
            [[ -f artifacts/live/lightwell-proof.md ]] && cat artifacts/live/lightwell-proof.md && echo ""
            [[ -f artifacts/live/demo-report-after.md ]] && cat artifacts/live/demo-report-after.md && echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Summary OK artifact_url=${ARTIFACT_URL:-none} id=${ARTIFACT_ID:-none}"
