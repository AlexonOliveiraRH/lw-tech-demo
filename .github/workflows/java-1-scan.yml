# Java step 1 - no Lightwell auth required.
# Spring app on public Maven Central pins + Trivy + CycloneDX SBOM for Lens + visual report.
# Default runner: GitHub-hosted (ubuntu-latest) so forks / any entitled user can run.

name: "J1 · Java Scan (vulnerable)"
run-name: "J1 · Java Scan — @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner (default GitHub-hosted for self-service; self-hosted optional for maintainers)"
        type: choice
        required: true
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - self-hosted

permissions:
  contents: read

jobs:
  scan:
    name: Scan vulnerable Java pins
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install tools
        run: ./scripts/java/ci-install-tools.sh

      - name: Build, test, scan + SBOM (public Maven Central)
        run: ./scripts/java/scan.sh before

      - name: Stage flat artifact bundle
        run: ./scripts/stage-artifact-bundle.sh before

      - uses: actions/upload-artifact@v4
        id: upload-java-scan-before
        with:
          name: java-scan-before
          path: artifacts/bundle-before/
          if-no-files-found: warn

      - name: Job Summary
        env:
          ARTIFACT_ID: ${{ steps.upload-java-scan-before.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload-java-scan-before.outputs.artifact-url }}
        run: |
          set -euo pipefail
          if [[ -z "${ARTIFACT_URL:-}" && -n "${ARTIFACT_ID:-}" ]]; then
            ARTIFACT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${ARTIFACT_ID}"
          fi
          {
            echo "## Download scan report and SBOM"
            echo ""
            if [[ -n "${ARTIFACT_URL:-}" ]]; then
              echo "[**Download zip**](${ARTIFACT_URL})"
              echo ""
              echo "Zip root: \`demo-report-before.html\` + \`sbom-before.cdx.json\`"
            else
              echo "Open **Artifacts** → \`java-scan-before\` on this run."
            fi
            echo ""
            echo "Unzip → open the HTML → upload the SBOM to [Lens](https://console.redhat.com/lightwell/lens)."
            echo ""
            echo "---"
            echo ""
            if [[ -f artifacts/live/demo-report-before.md ]]; then cat artifacts/live/demo-report-before.md; echo ""; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Summary OK artifact_url=${ARTIFACT_URL:-none} id=${ARTIFACT_ID:-none}"
