# Sales step 1 — no Lightwell auth required.
# Shows CVE noise on the public pins + CycloneDX SBOM for Lens hooks demo.

name: "1 · Scan (vulnerable)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan vulnerable pins
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: WITH_TRIVY=true ./scripts/ci-install-tools.sh
      - name: Scan before
        env:
          USE_LIGHTWELL: "false"
        run: ./scripts/scan-before.sh
      - name: SBOM (vulnerable) for Lightwell Lens
        env:
          USE_LIGHTWELL: "false"
          SBOM_STAGE: before
          SBOM_SKIP_INSTALL: "1"
        run: ./scripts/sbom-generate.sh
      - name: Visual demo report
        working-directory: apps/vulnerable-fastapi
        run: poetry run python ../../scripts/render-demo-report.py before
      - name: Stage flat artifact bundle
        run: ./scripts/stage-artifact-bundle.sh before
      - uses: actions/upload-artifact@v4
        with:
          # Flat zip root: demo-report-before.html + sbom-before.cdx.json (no nested paths)
          name: scan-before
          path: artifacts/bundle-before/
          if-no-files-found: warn
