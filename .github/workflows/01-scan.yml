# Step 1 — no Lightwell auth required.
# Public pins + scanners + CycloneDX SBOM for Lens + visual report.
# Default runner: GitHub-hosted (ubuntu-latest) so forks / any entitled user can run.

name: "1 · Scan (vulnerable)"
run-name: "1 · Scan — @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner (default GitHub-hosted for self-service; self-hosted optional for maintainers)"
        type: choice
        required: true
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - self-hosted

permissions:
  contents: read

jobs:
  scan:
    name: Scan vulnerable pins
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      # Runner only publishes whatever is written to $GITHUB_STEP_SUMMARY *during that step*.
      # Clear it for middle steps so body markdown files accumulate without appearing yet;
      # the final step restores the real path and writes Download first.
      - name: Park Job Summary path
        run: |
          mkdir -p artifacts/live
          echo "LW_REAL_STEP_SUMMARY=${GITHUB_STEP_SUMMARY}" >> "$GITHUB_ENV"
          echo "GITHUB_STEP_SUMMARY=" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: WITH_TRIVY=true ./scripts/ci-install-tools.sh
      - name: Scan before
        env:
          USE_LIGHTWELL: "false"
        run: ./scripts/scan-before.sh
      - name: SBOM (vulnerable) for Lightwell Lens
        env:
          USE_LIGHTWELL: "false"
          SBOM_STAGE: before
          SBOM_SKIP_INSTALL: "1"
        run: ./scripts/sbom-generate.sh
      - name: Visual demo report
        working-directory: apps/vulnerable-fastapi
        run: poetry run python ../../scripts/render-demo-report.py before
      - name: Stage flat artifact bundle
        run: ./scripts/stage-artifact-bundle.sh before
      - uses: actions/upload-artifact@v4
        id: upload-scan-before
        with:
          name: scan-before
          path: artifacts/bundle-before/
          if-no-files-found: warn
      - name: Job Summary (download first)
        env:
          ARTIFACT_ID: ${{ steps.upload-scan-before.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload-scan-before.outputs.artifact-url }}
        run: |
          export GITHUB_STEP_SUMMARY="${LW_REAL_STEP_SUMMARY}"
          if [[ -z "${ARTIFACT_URL}" && -n "${ARTIFACT_ID}" ]]; then
            ARTIFACT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${ARTIFACT_ID}"
          fi
          {
            echo "## Download scan report and SBOM"
            echo ""
            if [[ -n "${ARTIFACT_URL}" ]]; then
              echo "[**Download zip**](${ARTIFACT_URL}) — \`demo-report-before.html\` + \`sbom-before.cdx.json\` at the zip root."
            else
              echo "See **Artifacts** → \`scan-before\` at the bottom of this run."
            fi
            echo ""
            echo "Unzip → open the HTML → upload the SBOM to [Lens](https://console.redhat.com/lightwell/lens)."
            echo ""
            echo "---"
            echo ""
            [[ -f artifacts/live/scan-before-summary.md ]] && cat artifacts/live/scan-before-summary.md && echo ""
            [[ -f artifacts/live/demo-report-before.md ]] && cat artifacts/live/demo-report-before.md && echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
