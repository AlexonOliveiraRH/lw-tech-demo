# Step 1 — no Lightwell auth required.
# Public pins + scanners + CycloneDX SBOM for Lens + visual report.
# Default runner: GitHub-hosted (ubuntu-latest) so forks / any entitled user can run.

name: "1 · Scan (vulnerable)"
run-name: "1 · Scan — @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner (default GitHub-hosted for self-service; self-hosted optional for maintainers)"
        type: choice
        required: true
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - self-hosted

permissions:
  contents: read

jobs:
  scan:
    name: Scan vulnerable pins
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      # GitHub locks Job Summary writes per step in order — defer body until after upload
      # so the download link can be the first thing on the page.
      - name: Defer Job Summary body
        run: |
          mkdir -p artifacts/live
          : > artifacts/live/_summary_body.md
          echo "LW_REAL_STEP_SUMMARY=${GITHUB_STEP_SUMMARY}" >> "$GITHUB_ENV"
          echo "GITHUB_STEP_SUMMARY=${GITHUB_WORKSPACE}/artifacts/live/_summary_body.md" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: WITH_TRIVY=true ./scripts/ci-install-tools.sh
      - name: Scan before
        env:
          USE_LIGHTWELL: "false"
        run: ./scripts/scan-before.sh
      - name: SBOM (vulnerable) for Lightwell Lens
        env:
          USE_LIGHTWELL: "false"
          SBOM_STAGE: before
          SBOM_SKIP_INSTALL: "1"
        run: ./scripts/sbom-generate.sh
      - name: Visual demo report
        working-directory: apps/vulnerable-fastapi
        run: poetry run python ../../scripts/render-demo-report.py before
      - name: Stage flat artifact bundle
        run: ./scripts/stage-artifact-bundle.sh before
      - uses: actions/upload-artifact@v4
        id: upload-scan-before
        with:
          # Flat zip root: demo-report-before.html + sbom-before.cdx.json
          name: scan-before
          path: artifacts/bundle-before/
          if-no-files-found: warn
      - name: Job Summary (download first)
        env:
          ARTIFACT_URL: ${{ steps.upload-scan-before.outputs.artifact-url }}
        run: |
          {
            echo "## Download scan report and SBOM"
            echo ""
            if [[ -n "${ARTIFACT_URL}" ]]; then
              echo "[**Download zip**](${ARTIFACT_URL}) — \`demo-report-before.html\` + \`sbom-before.cdx.json\` at the zip root."
            else
              echo "Artifact zip: see **Artifacts** at the bottom of this run (\`scan-before\`)."
            fi
            echo ""
            echo "Unzip → open the HTML → upload the SBOM to [Lens](https://console.redhat.com/lightwell/lens)."
            echo ""
            echo "---"
            echo ""
            cat artifacts/live/_summary_body.md 2>/dev/null || true
          } >> "${LW_REAL_STEP_SUMMARY}"
