# Sales step 1 — no Lightwell auth required.
# Shows CVE noise on the public pins + CycloneDX SBOM for Lens hooks demo.

name: "1 · Scan (vulnerable)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan vulnerable pins
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: WITH_TRIVY=true ./scripts/ci-install-tools.sh
      - name: Scan before
        env:
          USE_LIGHTWELL: "false"
        run: ./scripts/scan-before.sh
      - name: SBOM (vulnerable) for Lightwell Lens
        env:
          USE_LIGHTWELL: "false"
          SBOM_STAGE: before
          SBOM_SKIP_INSTALL: "1"
        run: ./scripts/sbom-generate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: scan-before
          path: |
            artifacts/live/scan-before-summary.md
            artifacts/live/pip-audit-before.txt
            artifacts/live/trivy-before.txt
            artifacts/live/trivy-before.json
            artifacts/live/sbom-before.cdx.json
            artifacts/live/sbom-before-inventory.txt
            sbom/out/vulnerable-fastapi-before*.cdx.json
          if-no-files-found: warn
