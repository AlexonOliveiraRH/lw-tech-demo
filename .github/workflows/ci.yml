# Always-on CI: public PyPI / Maven Central paths only (no Lightwell token required).
# Demo stages with Lightwell live under Actions → "Lightwell Demo".

name: "z · CI (maintainers)"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Public Poetry + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vulnerable-fastapi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        working-directory: ${{ github.workspace }}
        run: ./scripts/ci-install-tools.sh

      - name: Install dependencies (public PyPI)
        run: poetry install --no-interaction

      - name: Show sqlparse pin
        run: poetry show sqlparse

      - name: Pytest
        run: poetry run pytest -q

  java-test:
    name: Public Maven + JUnit (Java demo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vulnerable-spring
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build + tests (public Maven Central)
        run: mvn -B -ntp verify
