# Java step 2 - paste Lightwell user + token for THIS RUN only (not stored in the repo).
# Same Spring app and tests, resolved from Lightwell Java Remediated + Validated.
# Default runner: GitHub-hosted (ubuntu-latest) so forks / any entitled user can run.

name: "J2 · Java Remediate (Lightwell)"
# The Lightwell username (orgId|name) stays out of the run title and summary:
# both are visible to anyone who can see the repository's Actions tab.
run-name: "J2 · Java Remediate — @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      lightwell_user:
        description: "REQUIRED — Lightwell username (orgId|service-account-name), e.g. 11009103|dasmlwsvc"
        type: string
        required: true
      lightwell_token:
        description: "REQUIRED — Lightwell service-account token for this run only"
        type: string
        required: true
      runner:
        description: "Runner (default GitHub-hosted for self-service; self-hosted optional for maintainers)"
        type: choice
        required: true
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - self-hosted

permissions:
  contents: read

# Credentials are NOT in workflow env: GitHub prints inherited env in each step's log
# header. Both are masked first (read from the event payload), then passed only to the
# step that needs them.
jobs:
  remediate:
    name: Remediate Java via Lightwell Network
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Mask credentials
        run: |
          u="$(jq -r '.inputs.lightwell_user' "$GITHUB_EVENT_PATH")"
          t="$(jq -r '.inputs.lightwell_token' "$GITHUB_EVENT_PATH")"
          echo "::add-mask::${u}"
          echo "::add-mask::${t}"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install tools
        run: ./scripts/java/ci-install-tools.sh

      - name: Build, test, scan + SBOM (Lightwell Java feeds)
        env:
          LIGHTWELL_USER: ${{ inputs.lightwell_user }}
          LIGHTWELL_TOKEN: ${{ inputs.lightwell_token }}
        run: ./scripts/java/scan.sh after

      - name: Stage flat artifact bundle
        if: always()
        run: ./scripts/stage-artifact-bundle.sh after

      - uses: actions/upload-artifact@v4
        if: always()
        id: upload-java-remediate-proof
        with:
          name: java-remediate-proof
          path: artifacts/bundle-after/
          if-no-files-found: warn

      - name: Job Summary
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.upload-java-remediate-proof.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload-java-remediate-proof.outputs.artifact-url }}
        run: |
          set -euo pipefail
          if [[ -z "${ARTIFACT_URL:-}" && -n "${ARTIFACT_ID:-}" ]]; then
            ARTIFACT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${ARTIFACT_ID}"
          fi
          {
            echo "## Download remediate report and SBOM"
            echo ""
            if [[ -n "${ARTIFACT_URL:-}" ]]; then
              echo "[**Download zip**](${ARTIFACT_URL})"
              echo ""
              echo "Zip root: \`demo-report-after.html\` + \`sbom-after.cdx.json\`"
            else
              echo "Open **Artifacts** → \`java-remediate-proof\` on this run."
            fi
            echo ""
            echo "Unzip → open the HTML → upload the SBOM to [Lens](https://console.redhat.com/lightwell/lens)."
            echo ""
            echo "---"
            echo ""
            echo "## Run identity"
            echo ""
            echo "| | |"
            echo "|--|--|"
            echo "| GitHub actor | \`@${{ github.actor }}\` |"
            echo "| Runner | \`${{ inputs.runner }}\` |"
            echo ""
            if [[ -f artifacts/live/demo-report-after.md ]]; then cat artifacts/live/demo-report-after.md; echo ""; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Summary OK artifact_url=${ARTIFACT_URL:-none} id=${ARTIFACT_ID:-none}"
