# Self-service demo: Java (Spring/Maven) + Trivy
# One Actions entry — pick step: Scan (before) or Remediate (after).
# Default runner: ubuntu-latest so forks / any entitled user can run.

name: "Demo · Java · Maven · Trivy"
run-name: "Demo · Java · Maven · Trivy · ${{ inputs.step }} — @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      step:
        description: "1 = Scan (vulnerable / before) · 2 = Remediate (Lightwell / after)"
        type: choice
        required: true
        default: scan
        options:
          - scan
          - remediate
      lightwell_user:
        description: "Remediate only — Lightwell username (orgId|service-account-name), e.g. 11009103|dasmlwsvc"
        type: string
        required: false
        default: ""
      lightwell_token:
        description: "Remediate only — Lightwell service-account token for this run only"
        type: string
        required: false
        default: ""
      runner:
        description: "Runner (default GitHub-hosted for self-service; self-hosted optional for maintainers)"
        type: choice
        required: true
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - self-hosted

permissions:
  contents: read

jobs:
  scan:
    name: Scan vulnerable Java pins
    if: inputs.step == 'scan'
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install tools
        run: ./scripts/java/ci-install-tools.sh

      - name: Build, test, scan + SBOM (public Maven Central)
        run: ./scripts/java/scan.sh before

      - name: Stage flat artifact bundle
        run: ./scripts/stage-artifact-bundle.sh before

      - uses: actions/upload-artifact@v4
        id: upload-java-scan-before
        with:
          name: java-scan-before
          path: artifacts/bundle-before/
          if-no-files-found: warn

      - name: Job Summary
        env:
          ARTIFACT_ID: ${{ steps.upload-java-scan-before.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload-java-scan-before.outputs.artifact-url }}
        run: |
          set -euo pipefail
          if [[ -z "${ARTIFACT_URL:-}" && -n "${ARTIFACT_ID:-}" ]]; then
            ARTIFACT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${ARTIFACT_ID}"
          fi
          {
            echo "## Download scan report and SBOM"
            echo ""
            if [[ -n "${ARTIFACT_URL:-}" ]]; then
              echo "[**Download zip**](${ARTIFACT_URL})"
              echo ""
              echo "Zip root: \`demo-report-before.html\` + \`sbom-before.cdx.json\`"
            else
              echo "Open **Artifacts** → \`java-scan-before\` on this run."
            fi
            echo ""
            echo "Unzip → open the HTML → upload the SBOM to [Lens](https://console.redhat.com/lightwell/lens)."
            echo ""
            echo "---"
            echo ""
            if [[ -f artifacts/live/demo-report-before.md ]]; then cat artifacts/live/demo-report-before.md; echo ""; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Summary OK artifact_url=${ARTIFACT_URL:-none} id=${ARTIFACT_ID:-none}"

  remediate:
    name: Remediate Java via Lightwell Network
    if: inputs.step == 'remediate'
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Require + mask credentials
        run: |
          set -euo pipefail
          u="$(jq -r '.inputs.lightwell_user // empty' "$GITHUB_EVENT_PATH")"
          t="$(jq -r '.inputs.lightwell_token // empty' "$GITHUB_EVENT_PATH")"
          if [[ -z "$u" || -z "$t" ]]; then
            echo "::error::Remediate requires lightwell_user and lightwell_token (paste from Lightwell Console)."
            exit 1
          fi
          echo "::add-mask::${u}"
          echo "::add-mask::${t}"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install tools
        run: ./scripts/java/ci-install-tools.sh

      - name: Build, test, scan + SBOM (Lightwell Java feeds)
        env:
          LIGHTWELL_USER: ${{ inputs.lightwell_user }}
          LIGHTWELL_TOKEN: ${{ inputs.lightwell_token }}
        run: ./scripts/java/scan.sh after

      - name: Stage flat artifact bundle
        if: always()
        run: ./scripts/stage-artifact-bundle.sh after

      - uses: actions/upload-artifact@v4
        if: always()
        id: upload-java-remediate-proof
        with:
          name: java-remediate-proof
          path: artifacts/bundle-after/
          if-no-files-found: warn

      - name: Job Summary
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.upload-java-remediate-proof.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload-java-remediate-proof.outputs.artifact-url }}
        run: |
          set -euo pipefail
          if [[ -z "${ARTIFACT_URL:-}" && -n "${ARTIFACT_ID:-}" ]]; then
            ARTIFACT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${ARTIFACT_ID}"
          fi
          {
            echo "## Download remediate report and SBOM"
            echo ""
            if [[ -n "${ARTIFACT_URL:-}" ]]; then
              echo "[**Download zip**](${ARTIFACT_URL})"
              echo ""
              echo "Zip root: \`demo-report-after.html\` + \`sbom-after.cdx.json\`"
            else
              echo "Open **Artifacts** → \`java-remediate-proof\` on this run."
            fi
            echo ""
            echo "Unzip → open the HTML → upload the SBOM to [Lens](https://console.redhat.com/lightwell/lens)."
            echo ""
            echo "---"
            echo ""
            echo "## Run identity"
            echo ""
            echo "| | |"
            echo "|--|--|"
            echo "| GitHub actor | \`@${{ github.actor }}\` |"
            echo "| Runner | \`${{ inputs.runner }}\` |"
            echo ""
            if [[ -f artifacts/live/demo-report-after.md ]]; then cat artifacts/live/demo-report-after.md; echo ""; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Summary OK artifact_url=${ARTIFACT_URL:-none} id=${ARTIFACT_ID:-none}"
